name: k6 Load Test na Nuvem

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  k6-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar k6 no ambiente
        uses: grafana/setup-k6-action@v1

      - name: Executar teste e exportar para Grafana Cloud
        run: k6 run --out cloud index.js
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_BROWSER_HEADLESS: "true"